services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: automatonlab-backend
    restart: unless-stopped
    networks:
      - homelab-proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: automatonlab-frontend
    restart: unless-stopped
    networks:
      - homelab-proxy

networks:
  homelab-proxy:
    external: true
